<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           viewport-fit=cover"
/>
  
  <title>Merry Christmas！</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  touch-action: manipulation;
  font-family: "Roboto Mono", monospace;
}

canvas {
  position: fixed;
  inset: 0;
  display: block;
}

#rotate-tip {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  z-index: 10;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>
<div id="rotate-tip">请使用竖屏浏览</div>

<script>
/* =======================
   Canvas / Viewport
======================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const rotateTip = document.getElementById("rotate-tip");

let cssW = 0;
let cssH = 0;
let dpr = 1;

function getViewport() {
  if (window.visualViewport) {
    return {
      width: window.visualViewport.width,
      height: window.visualViewport.height
    };
  }
  return {
    width: window.innerWidth,
    height: window.innerHeight
  };
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const vp = getViewport();

  cssW = vp.width;
  cssH = vp.height;

  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  rotateTip.style.display = cssW > cssH ? "flex" : "none";
}

window.addEventListener("resize", resize);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
resize();

/* =======================
   Constants
======================= */
const FOV = 900;
const BASE_DEPTH = 260;
const TREE_STEPS = 1000;
const SPEAR_STEPS = 1200;

let rotation = 0;
let time = 0;
let shakeTime = 0;
let shakeActive = false;

/* =======================
   Projection (CSS 尺寸)
======================= */
function project3D(x, y, z, camOffsetY) {
  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);

  const rx = x * cosR - z * sinR;
  const rz = x * sinR + z * cosR;

  const scale = FOV / (FOV + rz + BASE_DEPTH);

  return {
    x: cssW / 2 + rx * scale,
    y: cssH / 2 - y * scale + camOffsetY,
    scale
  };
}

/* =======================
   Particles
======================= */
class Particle {
  constructor(type, index) {
    this.type = type;
    this.index = index;
    this.orbitRadius = Math.random() * (type === "tree" ? 22 : 14) + 6;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = (Math.random() - 0.5) * 3.5;
    this.size = Math.random() * (type === "tree" ? 3 : 1.4) + 1;
    this.opacity = Math.random() * 0.4 + 0.4;
  }
}

const particles = [];
for (let i = 0; i < 180; i++)
  particles.push(new Particle("tree", Math.random() * TREE_STEPS));
for (let i = 0; i < 100; i++)
  particles.push(new Particle("spear", Math.random() * SPEAR_STEPS));

/* =======================
   Shapes
======================= */
function treePos(t, h, r, n, shake) {
  const y = t * h;
  const scale = (h - y) / h;
  const angle = 2 * Math.PI * n * y / h;
  const wave = shake * Math.sin(angle * 6 - shakeTime * 40) * 8;
  const rr = scale * r + wave;
  return {
    x: rr * Math.cos(angle),
    y,
    z: rr * Math.sin(angle)
  };
}

function spearPos(t, strand, baseW, h, shake) {
  const forkEnd = 0.22;
  const twistStart = 0.28;

  let r = t < forkEnd
    ? baseW
    : baseW * (1 - Math.pow((t - forkEnd) / (1 - forkEnd), 0.8));

  let angle = strand === 0 ? 0 : Math.PI;
  if (t > twistStart)
    angle += ((t - twistStart) / (1 - twistStart)) * 9 * Math.PI;

  r += shake * Math.sin(t * 100 + shakeTime * 50) * 5;
  return { x: r * Math.cos(angle), y: t * h, z: r * Math.sin(angle) };
}

/* =======================
   Interaction
======================= */
canvas.addEventListener("click", () => {
  shakeTime = 0;
  shakeActive = true;
});

/* =======================
   Draw
======================= */
function draw() {
  ctx.clearRect(0, 0, cssW, cssH);

  const shortSide = Math.min(cssW, cssH);
  const h = shortSide * 1.15;
  const rTree = shortSide * 0.42;
  const baseW = shortSide * 0.065;
  const camOffsetY = shortSide * 0.12;

  const breathe = Math.sin(time * 0.5) * 0.05;
  const shake = shakeActive
    ? Math.sin(shakeTime * Math.PI) * (1 - shakeTime * 0.6)
    : 0;

  /* Spear */
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,80,80,0.85)";
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#ff4444";

  for (let s = 0; s < 2; s++) {
    ctx.beginPath();
    for (let i = 0; i <= SPEAR_STEPS; i++) {
      const t = i / SPEAR_STEPS;
      const p = spearPos(t, s, baseW, h, shake);
      const o = project3D(p.x, p.y - h / 2, p.z, camOffsetY);
      i === 0 ? ctx.moveTo(o.x, o.y) : ctx.lineTo(o.x, o.y);
    }
    ctx.lineWidth = 2.2 + breathe;
    ctx.stroke();
  }

  ctx.shadowBlur = 0;

  /* Tree */
  ctx.strokeStyle = "rgba(255,190,100,0.75)";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (let i = 0; i <= TREE_STEPS; i++) {
    const t = i / TREE_STEPS;
    const p = treePos(t, h, rTree, 7, shake);
    const o = project3D(p.x, p.y - h / 2, p.z, camOffsetY);
    i === 0 ? ctx.moveTo(o.x, o.y) : ctx.lineTo(o.x, o.y);
  }
  ctx.stroke();

  /* Particles */
  for (const p of particles) {
    p.angle += p.speed * 0.015;

    let pos;
    if (p.type === "tree") {
      const base = treePos(p.index / TREE_STEPS, h, rTree, 7, shake);
      pos = project3D(
        base.x + Math.cos(p.angle) * p.orbitRadius,
        base.y - h / 2 + Math.sin(p.angle) * p.orbitRadius,
        base.z,
        camOffsetY
      );
      ctx.fillStyle = `rgba(120,255,180,${p.opacity})`;
    } else {
      const y = (p.index / SPEAR_STEPS) * h;
      pos = project3D(
        Math.cos(p.angle) * p.orbitRadius,
        y - h / 2,
        Math.sin(p.angle) * p.orbitRadius,
        camOffsetY
      );
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
    }

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.size * pos.scale, 0, Math.PI * 2);
    ctx.fill();
  }

  rotation += 0.0018;
  time += 0.01;

  if (shakeActive) {
    shakeTime += 0.02;
    if (shakeTime >= 1) shakeActive = false;
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
